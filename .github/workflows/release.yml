name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test
        run: go test ./...
      - name: Build exe
        run: go build -ldflags "-s -w -H windowsgui" -o jiyucho.exe .
      - name: Package
        shell: pwsh
        run: |
          $name = "jiyucho-${{ github.ref_name }}-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item jiyucho.exe, LICENSE, THIRD_PARTY_LICENSES.md, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "jiyucho-${{ github.ref_name }}-windows.zip" --generate-notes
